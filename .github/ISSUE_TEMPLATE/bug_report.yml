name: Bug report
description: Report a reproducible problem in Zones
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Run ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Zones version
      placeholder: 0.5.2
    validations:
      required: true
  - type: input
    id: java
    attributes:
      label: Java version
      placeholder: OpenJDK 17
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11
  - type: textarea
    id: data
    attributes:
      label: Data / logs
      description: Attach only files that you are allowed to share publicly.
  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I checked that the issue does not expose confidential or restricted data.
          required: true
