name: Feature request
description: Suggest an improvement or new capability
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Scientific or practical need
      description: What problem would this feature solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe how you expect the feature to work.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References or examples
      description: Add publications, equations, screenshots, or example data when relevant.
